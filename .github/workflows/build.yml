name: Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Unique build ID from bot"
        required: true
        type: string
      userId:
        description: "Telegram user ID"
        required: true
        type: string
      payload:
        description: "Build payload JSON (must contain url or zipAssetUrl)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and parse payload
        env:
          PAYLOAD_JSON: ${{ inputs.payload }}
          JOB_ID: ${{ inputs.jobId }}
        run: |
          set -euo pipefail
          printf '%s' "$PAYLOAD_JSON" > payload.json
          jq -e . payload.json >/dev/null
          ASSET_URL="$(jq -r '.zipAssetUrl // .url // empty' payload.json)"
          BUILD_TYPE="$(jq -r '.buildType // "release"' payload.json)"
          if [ -z "$ASSET_URL" ]; then
            echo "::error::Payload harus berisi field url atau zipAssetUrl."
            cat payload.json
            exit 1
          fi
          if [ "$BUILD_TYPE" != "debug" ] && [ "$BUILD_TYPE" != "release" ]; then
            echo "::error::buildType harus debug atau release."
            exit 1
          fi
          echo "ASSET_URL=$ASSET_URL" >> "$GITHUB_ENV"
          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Download project ZIP
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            --output project.zip "$ASSET_URL"

      - name: Extract project
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q project.zip -d project

          shopt -s nullglob dotglob
          entries=(project/*/)
          if [ "${#entries[@]}" -eq 1 ] && [ -f "${entries[0]}pubspec.yaml" ]; then
            tmp="$(mktemp -d)"
            mv "${entries[0]}"* "$tmp"/
            rm -rf project
            mv "$tmp" project
          fi

      - name: Validate Flutter project
        run: |
          if [ ! -f project/pubspec.yaml ]; then
            echo "::error::pubspec.yaml tidak ditemukan. ZIP harus berisi project Flutter."
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi

      - name: Flutter dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: |
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 1
